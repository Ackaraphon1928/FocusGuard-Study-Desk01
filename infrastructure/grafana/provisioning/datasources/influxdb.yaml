apiVersion: 1
datasources:
  - name: FocusGuard InfluxDB
    uid: focusguard-influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: focusguard
      defaultBucket: focusguard
    secureJsonData:
      token: $INFLUX_TOKEN
