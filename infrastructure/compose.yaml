name: focusguard
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped
  influxdb:
    image: influxdb:2.7.11
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: focusguard
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?Run python infrastructure/setup.py first}
      DOCKER_INFLUXDB_INIT_ORG: focusguard
      DOCKER_INFLUXDB_INIT_BUCKET: focusguard
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?Run python infrastructure/setup.py first}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      MQTT_ENABLED: "true"
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN:?Run python infrastructure/setup.py first}
      INFLUX_ORG: focusguard
      INFLUX_BUCKET: focusguard
      FOCUSGUARD_DB: /app/data/focusguard.sqlite3
      FOCUSGUARD_MODE: ${FOCUSGUARD_MODE:-demo}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - api-data:/app/data
    depends_on:
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: focusguard
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run python infrastructure/setup.py first}
      GF_USERS_ALLOW_SIGN_UP: "false"
      INFLUX_TOKEN: ${INFLUX_TOKEN:?Run python infrastructure/setup.py first}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mosquitto-data:
  influxdb-data:
  influxdb-config:
  grafana-data:
  api-data:
